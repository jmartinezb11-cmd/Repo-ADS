<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="contenedor contenedor-login">

        <h1>Iniciar sesión</h1>

        <p class="subtitulo">
            Sistema de Gestión de Becas
        </p>

        <form id="formLogin">

            <div class="campo">
                <label for="email">
                    Correo electrónico *
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="password">
                    Contraseña *
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >
            </div>

            <button type="submit" class="boton-registro">
                Ingresar
            </button>

            <p id="mensaje" class="mensaje"></p>

        </form>

        <p class="enlace-secundario">
            ¿No tienes cuenta?
            <a href="index.html">Regístrate aquí</a>
        </p>

    </div>

    <script src="js/login.js"></script>
</body>
</html>
