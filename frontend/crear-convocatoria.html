<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Convocatoria</title>
    <link rel="stylesheet" href="css/convocatoria.css">
</head>

<body>

    <div class="contenedor">
        <h1>Crear convocatoria</h1>
        <p class="subtitulo">
            Complete la información para registrar una nueva convocatoria de beca.
        </p>

        <form id="formConvocatoria">

            <label for="titulo">Título *</label>
            <input
                type="text"
                id="titulo"
                required
                minlength="3"
                maxlength="150"
            >

            <label for="descripcion">Descripción *</label>
            <textarea
                id="descripcion"
                required
                minlength="10"
            ></textarea>

            <label for="tipo_beca">Tipo de beca *</label>
            <input
                type="text"
                id="tipo_beca"
                required
            >

            <label for="institucion">Institución *</label>
            <input
                type="text"
                id="institucion"
                required
            >

            <div class="fila">

                <div>
                    <label for="fecha_apertura">Fecha de apertura *</label>
                    <input
                        type="date"
                        id="fecha_apertura"
                        required
                    >
                </div>

                <div>
                    <label for="fecha_cierre">Fecha de cierre *</label>
                    <input
                        type="date"
                        id="fecha_cierre"
                        required
                    >
                </div>

            </div>

            <label for="nivel_educativo">Nivel educativo *</label>
            <select id="nivel_educativo" required>
                <option value="">Seleccione una opción</option>
                <option value="Básico">Básico</option>
                <option value="Diversificado">Diversificado</option>
                <option value="Universitario">Universitario</option>
            </select>

            <label for="requisitos">Requisitos *</label>
            <textarea
                id="requisitos"
                required
                minlength="5"
            ></textarea>

            <div class="fila">

                <div>
                    <label for="monto_beneficio">Monto del beneficio</label>
                    <input
                        type="number"
                        id="monto_beneficio"
                        min="0"
                        step="0.01"
                    >
                </div>

                <div>
                    <label for="cupos_disponibles">Cupos disponibles</label>
                    <input
                        type="number"
                        id="cupos_disponibles"
                        min="0"
                    >
                </div>

            </div>

            <button type="submit" id="btnCrear">
                Crear convocatoria
            </button>

            <div id="mensaje"></div>

        </form>
    </div>

    <script src="js/convocatoria.js"></script>

</body>
</html>
