<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convocatorias Disponibles - Sistema de Becas</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/convocatorias.css">
</head>
<body>
  <div class="container">
    <header class="header-banner">
      <div class="header-info">
        <h2>Convocatorias de Becas Disponibles</h2>
        <p class="subtitle">Explora los programas de financiamiento vigentes y postúlate antes de la fecha límite.</p>
      </div>
      <a href="index.html" class="btn-volver">← Volver al Inicio</a>
    </header>

    <div id="alert-box" class="alert hidden"></div>

    <div class="toolbar">
      <span id="contador-convocatorias" class="contador">Cargando convocatorias...</span>
    </div>

    <!-- Contenedor dinámico de tarjetas -->
    <section id="lista-convocatorias" class="cards-grid">
      <!-- Se inyectan las tarjetas desde convocatorias.js -->
    </section>

    <!-- Modal para ver detalles y requisitos completos -->
    <div id="modal-detalle" class="modal-backdrop hidden">
      <div class="modal-card">
        <button type="button" class="modal-close" id="btn-cerrar-modal" aria-label="Cerrar">&times;</button>
        <div class="modal-header">
          <span id="modal-estado" class="badge"></span>
          <h3 id="modal-titulo"></h3>
          <p class="modal-vigencia" id="modal-fechas"></p>
        </div>

        <div class="modal-body">
          <h4>Descripción del Programa</h4>
          <p id="modal-descripcion"></p>

          <h4>Requisitos Obligatorios</h4>
          <ul id="modal-requisitos" class="requisitos-lista"></ul>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-volver-modal">Cerrar</button>
          <button type="button" class="btn-primary" id="btn-solicitar">Solicitar Beca</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/convocatorias.js"></script>
</body>
</html>
