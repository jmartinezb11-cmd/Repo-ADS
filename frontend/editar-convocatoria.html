<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Convocatoria - Sistema de Becas</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/editar-convocatoria.css">
</head>

<body>
  <div class="container">

    <header class="header">
      <h2>Modificar Convocatoria</h2>
      <a href="index.html" class="btn-secondary">Volver al Inicio</a>
    </header>

    <div id="alert-box" class="alert hidden"></div>

    <form id="form-editar-convocatoria" class="form-card">

      <div class="form-group">
        <label for="id_convocatoria">ID Convocatoria</label>
        <input
          type="text"
          id="id_convocatoria"
          readonly
          class="readonly"
        >
      </div>

      <div class="form-group">
        <label for="titulo">Título de la Convocatoria *</label>
        <input
          type="text"
          id="titulo"
          name="titulo"
          required
        >
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción *</label>
        <textarea
          id="descripcion"
          name="descripcion"
          rows="4"
          required
        ></textarea>
      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="tipo_beca">Tipo de Beca *</label>
          <input
            type="text"
            id="tipo_beca"
            name="tipo_beca"
            required
          >
        </div>

        <div class="form-group">
          <label for="institucion">Institución *</label>
          <input
            type="text"
            id="institucion"
            name="institucion"
            required
          >
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="fecha_apertura">Fecha de Apertura *</label>
          <input
            type="date"
            id="fecha_apertura"
            name="fecha_apertura"
            required
          >
        </div>

        <div class="form-group">
          <label for="fecha_cierre">Fecha de Cierre *</label>
          <input
            type="date"
            id="fecha_cierre"
            name="fecha_cierre"
            required
          >
        </div>

      </div>

      <div class="form-group">
        <label for="nivel_educativo">Nivel Educativo *</label>
        <input
          type="text"
          id="nivel_educativo"
          name="nivel_educativo"
          required
        >
      </div>

      <div class="form-group">
        <label for="requisitos">Requisitos *</label>
        <textarea
          id="requisitos"
          name="requisitos"
          rows="3"
          required
        ></textarea>
      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="monto_beneficio">Monto del Beneficio</label>
          <input
            type="number"
            id="monto_beneficio"
            name="monto_beneficio"
            min="0"
            step="0.01"
          >
        </div>

        <div class="form-group">
          <label for="cupos_disponibles">Cupos Disponibles</label>
          <input
            type="number"
            id="cupos_disponibles"
            name="cupos_disponibles"
            min="0"
          >
        </div>

      </div>

      <div class="form-group">
        <label for="estado">Estado</label>
        <input
          type="text"
          id="estado"
          readonly
          class="readonly"
        >
      </div>

      <div class="form-actions">

        <button
          type="submit"
          class="btn-primary"
          id="btn-guardar"
        >
          Guardar Cambios
        </button>

        <button
          type="button"
          class="btn-secondary"
          id="btn-cancelar"
        >
          Cancelar
        </button>

      </div>

    </form>

  </div>

  <script src="js/editar-convocatoria.js"></script>
</body>
</html>
