<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Convocatoria - Sistema de Becas</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/editar-convocatoria.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h2>Modificar Convocatoria</h2>
      <a href="index.html" class="btn-secondary">Volver al Inicio</a>
    </header>

    <div id="alert-box" class="alert hidden"></div>

    <form id="form-editar-convocatoria" class="form-card">
      <div class="form-group">
        <label for="id_convocatoria">ID Convocatoria (Solo lectura)</label>
        <input type="text" id="id_convocatoria" name="id_convocatoria" readonly class="readonly">
      </div>

      <div class="form-group">
        <label for="titulo">Título de la Convocatoria *</label>
        <input type="text" id="titulo" name="titulo" required placeholder="Ej. Beca a la Excelencia Académica">
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción *</label>
        <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="fecha_inicio">Fecha de Inicio *</label>
          <input type="date" id="fecha_inicio" name="fecha_inicio" required>
        </div>
        <div class="form-group">
          <label for="fecha_fin">Fecha de Finalización *</label>
          <input type="date" id="fecha_fin" name="fecha_fin" required>
        </div>
      </div>

      <div class="form-group">
        <label for="requisitos">Requisitos *</label>
        <textarea id="requisitos" name="requisitos" rows="3" required placeholder="Requisitos separados por comas o líneas"></textarea>
      </div>

      <div class="form-group">
        <label for="estado">Estado de la Convocatoria *</label>
        <select id="estado" name="estado" required>
          <option value="borrador">Borrador</option>
          <option value="publicada">Publicada</option>
          <option value="cerrada">Cerrada</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="btn-guardar">Guardar Cambios</button>
        <button type="button" class="btn-secondary" id="btn-cancelar">Cancelar</button>
      </div>
    </form>
  </div>

  <script src="js/editar-convocatoria.js"></script>
</body>
</html>
