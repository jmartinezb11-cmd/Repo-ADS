<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Completar Solicitud - Sistema de Becas</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/completar-solicitud.css">
</head>

<body>

  <div class="container">

    <header class="header">
      <div>
        <h2>Completar Solicitud</h2>

        <p class="subtitle">
          Ingresa la información requerida para completar tu solicitud de beca.
        </p>
      </div>

      <a href="convocatorias.html" class="btn-secondary">
        Volver
      </a>
    </header>

    <div id="alert-box" class="alert hidden"></div>

    <form id="form-solicitud" class="form-solicitud">

      <section class="form-section">

        <h3>Información socioeconómica</h3>

        <div class="form-group full-width">
          <label for="situacion_economica">
            Situación económica
          </label>

          <textarea
            id="situacion_economica"
            required
            minlength="10"
            maxlength="2000"
          ></textarea>
        </div>

        <div class="form-grid">

          <div class="form-group">
            <label for="ingresos_familiares">
              Ingresos familiares mensuales
            </label>

            <input
              type="number"
              id="ingresos_familiares"
              min="0"
              step="0.01"
              required
            >
          </div>

          <div class="form-group">
            <label for="integrantes_hogar">
              Integrantes del hogar
            </label>

            <input
              type="number"
              id="integrantes_hogar"
              min="1"
              required
            >
          </div>

          <div class="form-group">
            <label for="dependientes_economicos">
              Dependientes económicos
            </label>

            <input
              type="number"
              id="dependientes_economicos"
              min="0"
              required
            >
          </div>

          <div class="form-group">
            <label for="ocupacion_responsable">
              Ocupación del responsable
            </label>

            <input
              type="text"
              id="ocupacion_responsable"
              maxlength="150"
              required
            >
          </div>

        </div>

      </section>


      <section class="form-section">

        <h3>Información académica</h3>

        <div class="form-grid">

          <div class="form-group">
            <label for="institucion_educativa">
              Institución educativa
            </label>

            <input
              type="text"
              id="institucion_educativa"
              maxlength="200"
              required
            >
          </div>

          <div class="form-group">
            <label for="carrera_area">
              Carrera o área de estudio
            </label>

            <input
              type="text"
              id="carrera_area"
              maxlength="200"
              required
            >
          </div>

          <div class="form-group">
            <label for="grado_semestre">
              Grado o semestre
            </label>

            <input
              type="text"
              id="grado_semestre"
              maxlength="100"
              required
            >
          </div>

          <div class="form-group">
            <label for="promedio_academico">
              Promedio académico
            </label>

            <input
              type="number"
              id="promedio_academico"
              min="0"
              max="100"
              step="0.01"
              required
            >
          </div>

        </div>

      </section>


      <section class="form-section">

        <h3>Motivación</h3>

        <div class="form-group full-width">

          <label for="motivacion">
            ¿Por qué deseas obtener esta beca?
          </label>

          <textarea
            id="motivacion"
            minlength="10"
            maxlength="2000"
            required
          ></textarea>

        </div>

        <div class="form-group full-width">

          <label for="meta_academica">
            Meta académica
          </label>

          <textarea
            id="meta_academica"
            minlength="10"
            maxlength="2000"
            required
          ></textarea>

        </div>

      </section>


      <div class="form-actions">

        <a
          href="convocatorias.html"
          class="btn-secondary"
        >
          Cancelar
        </a>

        <button
          type="submit"
          class="btn-primary"
          id="btn-guardar"
        >
          Guardar información
        </button>

      </div>

    </form>

  </div>

  <script src="js/completar-solicitud.js"></script>

</body>
</html>
