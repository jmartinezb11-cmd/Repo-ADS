<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Estudiante</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="contenedor">

        <h1>Registro de Estudiante</h1>

        <p class="subtitulo">
            Sistema de Gestión de Becas
        </p>

        <form id="formRegistro">

            <!-- ========================= -->
            <!-- DATOS PERSONALES -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>1. Datos personales</h2>

                <div class="grid">

                    <div class="campo">
                        <label for="primer_nombre">
                            Primer nombre *
                        </label>

                        <input
                            type="text"
                            id="primer_nombre"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="segundo_nombre">
                            Segundo nombre
                        </label>

                        <input
                            type="text"
                            id="segundo_nombre"
                        >
                    </div>

                    <div class="campo">
                        <label for="primer_apellido">
                            Primer apellido *
                        </label>

                        <input
                            type="text"
                            id="primer_apellido"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="segundo_apellido">
                            Segundo apellido
                        </label>

                        <input
                            type="text"
                            id="segundo_apellido"
                        >
                    </div>

                    <div class="campo">
                        <label for="cui">
                            CUI *
                        </label>

                        <input
                            type="text"
                            id="cui"
                            maxlength="13"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="fecha_nacimiento">
                            Fecha de nacimiento *
                        </label>

                        <input
                            type="date"
                            id="fecha_nacimiento"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="genero">
                            Género *
                        </label>

                        <select id="genero" required>
                            <option value="">
                                Seleccione
                            </option>

                            <option value="Masculino">
                                Masculino
                            </option>

                            <option value="Femenino">
                                Femenino
                            </option>

                            <option value="Otro">
                                Otro
                            </option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="nacionalidad">
                            Nacionalidad *
                        </label>

                        <input
                            type="text"
                            id="nacionalidad"
                            value="Guatemalteca"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefono">
                            Teléfono *
                        </label>

                        <input
                            type="text"
                            id="telefono"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefono_alternativo">
                            Teléfono alternativo
                        </label>

                        <input
                            type="text"
                            id="telefono_alternativo"
                        >
                    </div>

                </div>

            </section>


            <!-- ========================= -->
            <!-- DIRECCIÓN -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>2. Dirección</h2>

                <div class="grid">

                    <div class="campo">
                        <label for="departamento">
                            Departamento *
                        </label>

                        <input
                            type="text"
                            id="departamento"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="municipio">
                            Municipio *
                        </label>

                        <input
                            type="text"
                            id="municipio"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="zona_aldea">
                            Zona / Aldea
                        </label>

                        <input
                            type="text"
                            id="zona_aldea"
                        >
                    </div>

                    <div class="campo campo-completo">
                        <label for="direccion_exacta">
                            Dirección exacta *
                        </label>

                        <input
                            type="text"
                            id="direccion_exacta"
                            required
                        >
                    </div>

                </div>

            </section>


            <!-- ========================= -->
            <!-- INFORMACIÓN ADICIONAL -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>3. Información adicional</h2>

                <div class="grid">

                    <div class="campo">
                        <label for="pueblo_pertenencia">
                            Pueblo de pertenencia
                        </label>

                        <select id="pueblo_pertenencia">

                            <option value="">
                                Seleccione
                            </option>

                            <option value="Maya">
                                Maya
                            </option>

                            <option value="Garifuna">
                                Garífuna
                            </option>

                            <option value="Xinka">
                                Xinka
                            </option>

                            <option value="Ladino">
                                Ladino
                            </option>

                            <option value="Otro">
                                Otro
                            </option>

                        </select>
                    </div>

                    <div class="campo checkbox-container">

                        <label>
                            <input
                                type="checkbox"
                                id="discapacidad"
                            >

                            Posee alguna discapacidad
                        </label>

                    </div>

                    <div
                        class="campo"
                        id="contenedorTipoDiscapacidad"
                        style="display: none;"
                    >

                        <label for="tipo_discapacidad">
                            Tipo de discapacidad
                        </label>

                        <input
                            type="text"
                            id="tipo_discapacidad"
                        >

                    </div>

                </div>

            </section>


            <!-- ========================= -->
            <!-- DATOS ACADÉMICOS -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>4. Datos académicos</h2>

                <div class="grid">

                    <div class="campo">

                        <label for="nivel_educativo">
                            Nivel educativo *
                        </label>

                        <select
                            id="nivel_educativo"
                            required
                        >

                            <option value="">
                                Seleccione
                            </option>

                            <option value="basico">
                                Básico
                            </option>

                            <option value="bachillerato">
                                Bachillerato
                            </option>

                            <option value="perito">
                                Perito
                            </option>

                            <option value="universitario">
                                Universitario
                            </option>

                        </select>

                    </div>

                </div>


                <!-- SECUNDARIA / DIVERSIFICADO -->

                <div
                    id="camposSecundaria"
                    class="grid campos-dinamicos"
                    style="display: none;"
                >

                    <div class="campo">

                        <label for="establecimiento_educativo">
                            Establecimiento educativo
                        </label>

                        <input
                            type="text"
                            id="establecimiento_educativo"
                        >

                    </div>

                    <div class="campo">

                        <label for="grado_actual">
                            Grado actual
                        </label>

                        <input
                            type="text"
                            id="grado_actual"
                        >

                    </div>

                    <div class="campo">

                        <label for="jornada">
                            Jornada
                        </label>

                        <select id="jornada">

                            <option value="">
                                Seleccione
                            </option>

                            <option value="matutina">
                                Matutina
                            </option>

                            <option value="vespertina">
                                Vespertina
                            </option>

                            <option value="nocturna">
                                Nocturna
                            </option>

                        </select>

                    </div>

                    <div class="campo">

                        <label for="sector">
                            Sector
                        </label>

                        <select id="sector">

                            <option value="">
                                Seleccione
                            </option>

                            <option value="publico">
                                Público
                            </option>

                            <option value="privado">
                                Privado
                            </option>

                            <option value="cooperativa">
                                Cooperativa
                            </option>

                            <option value="municipal">
                                Municipal
                            </option>

                        </select>

                    </div>

                    <div class="campo">

                        <label for="promedio_notas">
                            Promedio de notas
                        </label>

                        <input
                            type="number"
                            id="promedio_notas"
                            min="0"
                            max="100"
                            step="0.01"
                        >

                    </div>

                    <div
                        class="campo"
                        id="contenedorEspecialidad"
                        style="display: none;"
                    >

                        <label for="especialidad">
                            Especialidad
                        </label>

                        <input
                            type="text"
                            id="especialidad"
                        >

                    </div>

                </div>


                <!-- UNIVERSIDAD -->

                <div
                    id="camposUniversidad"
                    class="grid campos-dinamicos"
                    style="display: none;"
                >

                    <div class="campo">

                        <label for="universidad">
                            Universidad *
                        </label>

                        <input
                            type="text"
                            id="universidad"
                        >

                    </div>

                    <div class="campo">

                        <label for="facultad_escuela">
                            Facultad / Escuela
                        </label>

                        <input
                            type="text"
                            id="facultad_escuela"
                        >

                    </div>

                    <div class="campo">

                        <label for="carrera">
                            Carrera *
                        </label>

                        <input
                            type="text"
                            id="carrera"
                        >

                    </div>

                    <div class="campo">

                        <label for="anio_semestre_actual">
                            Año / Semestre actual *
                        </label>

                        <input
                            type="text"
                            id="anio_semestre_actual"
                        >

                    </div>

                    <div class="campo">

                        <label for="carnet_universitario">
                            Carnet universitario
                        </label>

                        <input
                            type="text"
                            id="carnet_universitario"
                        >

                    </div>

                    <div class="campo">

                        <label for="cum">
                            CUM / Promedio
                        </label>

                        <input
                            type="number"
                            id="cum"
                            min="0"
                            max="100"
                            step="0.01"
                        >

                    </div>

                    <div class="campo">

                        <label for="creditos_aprobados">
                            Créditos aprobados
                        </label>

                        <input
                            type="number"
                            id="creditos_aprobados"
                            min="0"
                        >

                    </div>

                    <div class="campo">

                        <label for="modalidad">
                            Modalidad
                        </label>

                        <select id="modalidad">

                            <option value="">
                                Seleccione
                            </option>

                            <option value="presencial">
                                Presencial
                            </option>

                            <option value="virtual">
                                Virtual
                            </option>

                            <option value="semipresencial">
                                Semipresencial
                            </option>

                        </select>

                    </div>

                </div>

            </section>


            <!-- ========================= -->
            <!-- DATOS SOCIOECONÓMICOS -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>5. Datos socioeconómicos</h2>

                <div class="grid">

                    <div class="campo">

                        <label for="ingreso_familiar_mensual">
                            Ingreso familiar mensual
                        </label>

                        <input
                            type="number"
                            id="ingreso_familiar_mensual"
                            min="0"
                            step="0.01"
                        >

                    </div>

                    <div class="campo">

                        <label for="numero_miembros_nucleo">
                            Miembros del núcleo familiar
                        </label>

                        <input
                            type="number"
                            id="numero_miembros_nucleo"
                            min="1"
                        >

                    </div>

                    <div class="campo">

                        <label for="ocupacion_padre">
                            Ocupación del padre
                        </label>

                        <input
                            type="text"
                            id="ocupacion_padre"
                        >

                    </div>

                    <div class="campo">

                        <label for="ocupacion_madre">
                            Ocupación de la madre
                        </label>

                        <input
                            type="text"
                            id="ocupacion_madre"
                        >

                    </div>

                    <div class="campo">

                        <label for="ocupacion_encargado">
                            Ocupación del encargado
                        </label>

                        <input
                            type="text"
                            id="ocupacion_encargado"
                        >

                    </div>

                    <div class="campo">

                        <label for="tipo_vivienda">
                            Tipo de vivienda
                        </label>

                        <select id="tipo_vivienda">

                            <option value="">
                                Seleccione
                            </option>

                            <option value="propia">
                                Propia
                            </option>

                            <option value="alquilada">
                                Alquilada
                            </option>

                            <option value="prestada">
                                Prestada
                            </option>

                        </select>

                    </div>

                    <div class="campo">

                        <label for="dependientes_economicos">
                            Dependientes económicos
                        </label>

                        <input
                            type="number"
                            id="dependientes_economicos"
                            min="0"
                        >

                    </div>

                </div>

            </section>


            <!-- ========================= -->
            <!-- CONTACTO EMERGENCIA -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>6. Contacto de emergencia</h2>

                <div class="grid">

                    <div class="campo">

                        <label for="nombre_encargado">
                            Nombre del contacto *
                        </label>

                        <input
                            type="text"
                            id="nombre_encargado"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="parentesco">
                            Parentesco *
                        </label>

                        <input
                            type="text"
                            id="parentesco"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="telefono_emergencia">
                            Teléfono de emergencia *
                        </label>

                        <input
                            type="text"
                            id="telefono_emergencia"
                            required
                        >

                    </div>

                </div>

            </section>


            <!-- ========================= -->
            <!-- CUENTA -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>7. Datos de cuenta</h2>

                <div class="grid">

                    <div class="campo">

                        <label for="email">
                            Correo electrónico *
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="password">
                            Contraseña *
                        </label>

                        <input
                            type="password"
                            id="password"
                            minlength="8"
                            required
                        >

                        <small>
                            Mínimo 8 caracteres, una mayúscula,
                            un número y un carácter especial.
                        </small>

                    </div>

                    <div class="campo">

                        <label for="confirmar_password">
                            Confirmar contraseña *
                        </label>

                        <input
                            type="password"
                            id="confirmar_password"
                            minlength="8"
                            required
                        >

                    </div>

                </div>

            </section>


            <!-- ========================= -->
            <!-- CONSENTIMIENTO -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>8. Consentimientos</h2>

                <div class="campo checkbox-container">

                    <label>
                        <input
                            type="checkbox"
                            id="terminos"
                            required
                        >

                        Acepto los términos y condiciones.
                    </label>

                </div>

                <div class="campo checkbox-container">

                    <label>
                        <input
                            type="checkbox"
                            id="tratamiento_datos"
                            required
                        >

                        Autorizo el tratamiento de mis datos personales.
                    </label>

                </div>

            </section>


            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="mensaje"
            ></div>


            <!-- BOTÓN -->

            <button
                type="submit"
                class="boton-registro"
            >
                Registrarse
            </button>

        </form>

    </div>


    <script src="js/app.js"></script>

</body>
</html>
