<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Sistema de Becas</title>
  <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Mi Perfil</h1>
      <p>Consulta y actualiza tu información registrada en la plataforma.</p>
    </header>

    <div id="alert-box" class="alert hidden"></div>

    <form id="perfil-form">
      <!-- 1. DATOS PERSONALES -->
      <section class="card">
        <h2>Datos Personales</h2>
        <div class="grid-2">
          <div class="form-group">
            <label for="nombres">Nombres y Apellidos *</label>
            <input type="text" id="nombres" name="nombres" disabled required>
          </div>
          <div class="form-group">
            <label for="segundoNombre">Segundo Nombre / Apellido</label>
            <input type="text" id="segundoNombre" name="segundoNombre" disabled>
          </div>
          <div class="form-group">
            <label for="cui">CUI (Identificación única)</label>
            <input type="text" id="cui" name="cui" disabled readonly class="readonly">
          </div>
          <div class="form-group">
            <label for="fechaNacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" disabled readonly class="readonly">
          </div>
          <div class="form-group">
            <label for="genero">Género</label>
            <select id="genero" name="genero" disabled>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="nacionalidad">Nacionalidad</label>
            <input type="text" id="nacionalidad" name="nacionalidad" disabled>
          </div>
          <div class="form-group">
            <label for="telefono">Teléfono *</label>
            <input type="tel" id="telefono" name="telefono" disabled required>
          </div>
          <div class="form-group">
            <label for="direccion">Dirección *</label>
            <input type="text" id="direccion" name="direccion" disabled required>
          </div>
        </div>
      </section>

      <!-- 2. DATOS ACADÉMICOS -->
      <section class="card">
        <h2>Datos Académicos</h2>
        <div class="grid-2">
          <div class="form-group">
            <label for="nivelEducativo">Nivel Educativo</label>
            <select id="nivelEducativo" name="nivelEducativo" disabled>
              <option value="Básico">Básico</option>
              <option value="Bachillerato">Bachillerato</option>
              <option value="Perito">Perito</option>
              <option value="Universitario">Universitario</option>
            </select>
          </div>
          <div class="form-group">
            <label for="institucion">Institución Educativa</label>
            <input type="text" id="institucion" name="institucion" disabled>
          </div>
          <div class="form-group">
            <label for="carrera">Carrera / Especialidad</label>
            <input type="text" id="carrera" name="carrera" disabled>
          </div>
          <div class="form-group">
            <label for="promedio">Promedio General</label>
            <input type="number" step="0.01" id="promedio" name="promedio" disabled>
          </div>
        </div>
      </section>

      <!-- 3. DATOS SOCIOECONÓMICOS -->
      <section class="card">
        <h2>Datos Socioeconómicos y Familiares</h2>
        <div class="grid-2">
          <div class="form-group">
            <label for="ingresoFamiliar">Ingreso Familiar Mensual (Q)</label>
            <input type="number" id="ingresoFamiliar" name="ingresoFamiliar" disabled>
          </div>
          <div class="form-group">
            <label for="miembrosFamilia">Miembros del Núcleo Familiar</label>
            <input type="number" id="miembrosFamilia" name="miembrosFamilia" disabled>
          </div>
          <div class="form-group">
            <label for="ocupacionEncargado">Ocupación Encargado</label>
            <input type="text" id="ocupacionEncargado" name="ocupacionEncargado" disabled>
          </div>
          <div class="form-group">
            <label for="tipoVivienda">Tipo de Vivienda</label>
            <select id="tipoVivienda" name="tipoVivienda" disabled>
              <option value="Propia">Propia</option>
              <option value="Alquilada">Alquilada</option>
              <option value="Prestada">Prestada</option>
            </select>
          </div>
          <div class="form-group">
            <label for="dependientes">Dependientes Económicos</label>
            <input type="number" id="dependientes" name="dependientes" disabled>
          </div>
          <div class="form-group">
            <label for="contactoEmergencia">Contacto de Emergencia (Teléfono)</label>
            <input type="tel" id="contactoEmergencia" name="contactoEmergencia" disabled>
          </div>
        </div>
      </section>

      <!-- BOTONES DE ACCIÓN -->
      <div class="actions">
        <button type="button" id="btn-editar" class="btn btn-primary">Editar Perfil</button>
        <button type="submit" id="btn-guardar" class="btn btn-success hidden">Guardar Cambios</button>
        <button type="button" id="btn-cancelar" class="btn btn-secondary hidden">Cancelar</button>
      </div>
    </form>
  </div>

  <script src="js/perfil.js"></script>
</body>
</html>
